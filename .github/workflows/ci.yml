name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py-compile + unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile all modules
        run: |
          python -m py_compile \
            config.py errors.py data_manager.py ai_engine.py lstm_engine.py \
            predictor.py backtest.py ibkr_bridge.py logging_setup.py main.py \
            test.py test_logic.py verify_watchlist.py

      - name: Run unit tests
        run: python -m unittest test_logic -v
